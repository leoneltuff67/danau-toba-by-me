<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Danau yang Indah</title>
  <style>
    body {
      margin: 0;
      background: linear-gradient(to top, #87ceeb, #ffffff);
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .lake {
      position: relative;
      width: 100%;
      height: 60vh;
      background: radial-gradient(circle at center, #1e90ff, #00008b);
      border-radius: 50% / 10%;
      box-shadow: 0 10px 50px rgba(30, 144, 255, 0.7);
      overflow: hidden;
      margin-top: 20vh;
    }
    .wave {
      position: absolute;
      bottom: 0;
      width: 200%;
      height: 80px;
      background: rgba(255, 255, 255, 0.4);
      opacity: 0.6;
      border-radius: 50%;
      animation: waveMove 6s linear infinite;
      filter: blur(5px);
    }
    .wave:nth-child(1) {
      left: -50%;
      animation-delay: 0s;
    }
    .wave:nth-child(2) {
      left: -70%;
      animation-delay: 3s;
      opacity: 0.3;
      height: 100px;
    }
    @keyframes waveMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(50%); }
    }
    .sun {
      position: absolute;
      top: 10vh;
      right: 15%;
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, #ffdd00, #ffa500);
      border-radius: 50%;
      box-shadow: 0 0 50px 15px #ffdd00;
      animation: sunGlow 4s ease-in-out infinite alternate;
    }
    @keyframes sunGlow {
      0% { box-shadow: 0 0 30px 10px #ffdd00; }
      100% { box-shadow: 0 0 50px 20px #ffdd00; }
    }
    h1 {
      text-align: center;
      margin-top: 0;
      color: #023e8a;
      text-shadow: 2px 2px 4px #90e0ef;
    }
  </style>
</head>
<body>
  <h1>Danau Indah</h1>
  <div class="lake">
    <div class="wave"></div>
    <div class="wave"></div>
  </div>
  <div class="sun"></div>
</body>
</html>
